<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>L'Oréal Beauty Advisor</title>

    <!-- Material Icons for the send button -->
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />

    <!-- Simple clean font for the interface -->
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="page-wrapper">

      <!-- Header / L'Oréal branding -->
      <header class="site-header">
        <img
          src="loreal-logo.png"
          alt="L'Oréal"
          class="logo"
        />

        <h1 class="site-title">Beauty Advisor</h1>

        <p class="site-subtitle">
          Your L'Oréal product and beauty routine assistant
        </p>
      </header>

      <!-- Main chatbot -->
      <main>
        <section class="chatbox" aria-label="L'Oréal Beauty Advisor">

          <!-- Chat messages appear here -->
          <div
            id="chatWindow"
            class="chat-window"
            aria-live="polite"
          ></div>

          <!-- Message input -->
          <form id="chatForm" class="chat-form">
            <label for="userInput" class="visually-hidden">
              Message
            </label>

            <input
              id="userInput"
              name="userInput"
              type="text"
              placeholder="Ask about L'Oréal products or routines..."
              autocomplete="off"
              required
            />

            <button type="submit" id="sendBtn">
              <span class="material-icons">send</span>
              <span class="visually-hidden">Send</span>
            </button>
          </form>
        </section>
      </main>

      <!-- Footer -->
      <footer class="site-footer">
        <p>&copy; 2026 L'Oréal Beauty Advisor</p>

        <nav>
          <a href="#">Privacy Policy</a>
          <a href="#">Terms of Use</a>
        </nav>
      </footer>

    </div>

    <script src="script.js"></script>
  </body>
</html>
